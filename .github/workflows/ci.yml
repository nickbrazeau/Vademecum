# Every push and pull request runs the same checks as a commit on the owner's Mac:
# the API, MCP and Cloudflare suites, then the web app's types, tests and build.
# macOS, because Vademecum is a Mac install (ADR 0012) and its page rendering and
# text recognition use the system's own frameworks.
name: CI

on:
  push:
    branches: [main, option2-webapp-in-chat]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/mcp/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps/api[dev]" -e apps/mcp
      - name: Test
        run: >
          python -m pytest -p no:cacheprovider -o addopts="" -q
          --ignore=apps/api/tests/test_browser_flows.py
          apps/api/tests apps/mcp/tests deploy/cloudflare/tests

  web:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
