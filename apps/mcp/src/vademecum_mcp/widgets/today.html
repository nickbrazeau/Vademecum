<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vademecum today</title>
<style>
:root { color-scheme: light dark; --fg: #1d1d1f; --bg: transparent; --muted: #5c5c60; --line: #d9d9de;
  --accent: #2b5d8c; --held: #8a5a00; --ok: #2f6b3a; }
:root[data-theme="dark"], :root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fg: #ececec; --muted: #a9a9b0;
  --line: #34353a; --accent: #8fb8e8; --held: #e0b25a; --ok: #8fd19e; } }
:root[data-theme="dark"] { --fg: #ececec; --muted: #a9a9b0; --line: #34353a; --accent: #8fb8e8;
  --held: #e0b25a; --ok: #8fd19e; }
body { margin: 0; padding: 12px 16px 14px; background: var(--bg); color: var(--fg);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
h1 { font-size: 1.05rem; margin: 0 0 .5rem; }
h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 1rem 0 .35rem; }
p { margin: 0 0 .5rem; }
ul { margin: 0; padding: 0; list-style: none; }
li { padding: .45rem 0; border-top: 1px solid var(--line); }
li:first-child { border-top: 0; }
.claim { font-weight: 600; }
.badge { display: inline-block; font-size: .75rem; padding: .1rem .5rem; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); margin-left: .4rem; vertical-align: middle; }
.badge.evidence { color: var(--ok); border-color: var(--ok); }
.badge.held { color: var(--held); border-color: var(--held); }
.row { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; }
.stat { display: flex; flex-direction: column; min-width: 7rem; }
.stat b { font-size: 1.25rem; font-weight: 600; }
.stat span { font-size: .8rem; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
footer { margin-top: 1rem; padding-top: .6rem; border-top: 1px solid var(--line); font-size: .78rem; color: var(--muted); }
</style>
</head>
<body>
<main id="root" aria-live="polite"><p class="muted">Loading your cover sheet…</p></main>
<footer>Educational only. Not a substitute for clinical judgment, current institutional guidance or a specialist.
Nothing here counts down and nothing is owed.</footer>
<script>
(function () {
  "use strict";
  var root = document.getElementById("root");

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function n(value) { var v = Number(value); return isFinite(v) ? v : 0; }
  function plural(count, one, many) { return count === 1 ? one : many; }

  function supportBadge(point) {
    var label = point.support_label || point.support || "";
    var cls = point.support === "evidence_supported" ? "evidence" : (point.held ? "held" : "");
    return label ? '<span class="badge ' + cls + '">' + esc(label) + "</span>" : "";
  }

  function render(out) {
    if (!out || typeof out !== "object") {
      root.innerHTML = '<p class="muted">Nothing to show yet.</p>';
      return;
    }
    var html = "<h1>Today</h1>";

    var points = Array.isArray(out.worth_a_look) ? out.worth_a_look : [];
    html += "<h2>Worth a look</h2>";
    if (points.length === 0) {
      html += '<p class="muted small">' + esc(out.worth_a_look_message || "No learning points yet.") + "</p>";
    } else {
      html += "<ul>";
      points.slice(0, 5).forEach(function (point) {
        html += '<li><span class="claim">' + esc(point.claim) + "</span>" + supportBadge(point);
        if (Array.isArray(point.topics) && point.topics.length) {
          html += '<div class="muted small">' + esc(point.topics.slice(0, 3).join(" · ")) + "</div>";
        }
        html += "</li>";
      });
      html += "</ul>";
    }

    var tutor = out.tutor || {};
    var held = out.held || {};
    var lit = out.literature || {};
    var cycle = tutor.cycle || {};
    html += "<h2>Where things stand</h2>";
    html += '<div class="row">';
    html += '<div class="stat"><b>' + n(tutor.eligible) + "</b><span>" + plural(n(tutor.eligible), "question ready", "questions ready") + "</span></div>";
    if (n(cycle.total) > 0) {
      html += '<div class="stat"><b>' + n(cycle.remaining) + "</b><span>left in this pass</span></div>";
    }
    html += '<div class="stat"><b>' + (n(held.points) + n(held.questions)) + "</b><span>held for review</span></div>";
    html += '<div class="stat"><b>' + n(lit.unread) + "</b><span>" + plural(n(lit.unread), "literature update", "literature updates") + "</span></div>";
    html += '<div class="stat"><b>' + n(out.open_flag_count) + "</b><span>" + plural(n(out.open_flag_count), "open flag", "open flags") + "</span></div>";
    html += "</div>";
    if (tutor.message) html += '<p class="muted small">' + esc(tutor.message) + "</p>";
    if (Array.isArray(held.reasons) && held.reasons.length) {
      html += '<p class="muted small">Held because: ' + esc(held.reasons.slice(0, 2).join("; ")) + "</p>";
    }

    var updates = Array.isArray(lit.updates) ? lit.updates : [];
    if (updates.length) {
      html += "<h2>New in the literature</h2><ul>";
      updates.slice(0, 3).forEach(function (update) {
        var title = update.title || update.record_title || update.reason || "An update to a watched topic";
        html += "<li>" + esc(title);
        if (update.why || update.relevance) html += '<div class="muted small">' + esc(update.why || update.relevance) + "</div>";
        html += "</li>";
      });
      html += "</ul>";
    } else if (lit.message) {
      html += '<p class="muted small">' + esc(lit.message) + "</p>";
    }

    var flags = Array.isArray(out.recent_flags) ? out.recent_flags : [];
    if (flags.length) {
      html += "<h2>Recent gaps you flagged</h2><ul>";
      flags.slice(0, 4).forEach(function (flag) {
        html += "<li>" + esc(flag.text);
        if (flag.topic) html += '<span class="badge">' + esc(flag.topic) + "</span>";
        html += "</li>";
      });
      html += "</ul>";
    }

    root.innerHTML = html;
    fit();
  }

  function fit() {
    try {
      if (window.openai && typeof window.openai.notifyIntrinsicHeight === "function") {
        window.openai.notifyIntrinsicHeight(document.documentElement.scrollHeight);
      }
    } catch (error) { /* the host decides the height */ }
  }

  function theme() {
    try {
      var t = window.openai && window.openai.theme;
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (error) { /* system preference applies */ }
  }

  function current() {
    try { return window.openai && window.openai.toolOutput ? window.openai.toolOutput : null; } catch (error) { return null; }
  }

  window.addEventListener("message", function (event) {
    if (event.source !== window.parent) return;
    var message = event.data;
    if (message && message.method === "ui/notifications/tool-result") {
      render(message.params && message.params.structuredContent);
    }
  }, { passive: true });
  window.addEventListener("openai:set_globals", function () { theme(); render(current()); });
  theme();
  render(current());
})();
</script>
</body>
</html>
