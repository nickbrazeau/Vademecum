# Running the backend suite from the rewrite root has to mean the same thing as
# running it from apps/api. Without this file pytest takes this directory as its
# rootdir, walks everything under it, and starts collecting `Vademecum_arxive/`
# -- the read-only predecessor. That tree is reference material: it is never
# imported, never run and never modified here, and importing it would fail on
# its own dependencies before it failed on anything meaningful.
#
# `testpaths` is what a bare `pytest` uses; `norecursedirs` is what protects an
# explicit `pytest .` as well.
[pytest]
testpaths = apps/api/tests apps/mcp/tests
norecursedirs = Vademecum_arxive .codex-bridge .venv node_modules dist build .git *.egg-info
addopts = -q
